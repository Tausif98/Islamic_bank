services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7.4-alpine
    container_name: islamic_bank_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2-18
    container_name: islamic_bank_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      ME_CONFIG_MONGODB_SSL: "true"
      ME_CONFIG_MONGODB_URL: ${MONGODB_URL}
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${BASICAUTH_PASSWORD}

  broker:
    image: apache/kafka:latest
    container_name: islamic_bank_broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft mode — no Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      # Two listeners: one for clients, one for internal controller election
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      # Single-node settings (replication factor 1 = no replicas needed)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      # Confluent-specific: disable unnecessary features for dev
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s   # gives kafka time to fully boot before first check

  # ── Application ─────────────────────────────────────────────────────────────

  api:
    build: .
    container_name: islamic_bank_api
    restart: unless-stopped
    dns:                     # ← ADD THIS BLOCK
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Override Kafka/Redis URLs to use container names (not localhost)
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker — separate container, same codebase
  celery_worker:
    build: .
    container_name: islamic_bank_celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    dns:                     # ← ADD THIS BLOCK
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - redis
      - broker
      - api

  # Celery Beat — scheduler for periodic tasks (profit distribution)
  celery_beat:
    build: .
    container_name: islamic_bank_celery_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    dns:                     # ← ADD THIS BLOCK
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - redis
      - celery_worker

volumes:
  redis_data:
  kafka_data:




